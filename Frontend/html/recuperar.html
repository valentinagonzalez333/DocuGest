<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña / DocuGets</title>
    <link rel="stylesheet" href="/index.css">
    <script src="/js/ui.js" defer></script>
    <script src="/js/recuperar.js" defer></script>
</head>

<body>

    <main class="contenido">
        <div class="out">

            <div class="top">
                <div class="logo"></div>
                <h1>Recuperar contraseña</h1>
                <p class="top-texto">Escribe tu correo y te enviaremos un enlace para crear una nueva contraseña.</p>
            </div>

            <form id="formularioRecuperar">
                <div class="formField">
                    <label for="correo" class="text">Correo:</label>
                    <input type="email" placeholder="correo@empresa.com" name="correo" class="input" id="correo" required>
                </div>

                <div class="enlaceCuenta">
                    <a href="/">Volver a <span>iniciar sesión</span></a>
                </div>

                <button type="submit" class="btn-iniciar">Enviar enlace</button>
            </form>
        </div>
    </main>
</body>

</html>
